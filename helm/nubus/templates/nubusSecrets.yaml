# TODO: Move memcached password over to the umc-server chart

{{- $nubusMasterPassword := include "nubusTemplates.masterPassword" . -}}
{{- $nubusSecrets := list -}}

{{- /*
The "nubus-credentials" Secret mirrors the initial Administrator password for
operator convenience; nothing in this chart consumes it. Deployments that keep
their credentials outside the chart can turn it off with
`nubusCredentialsSecret.create: false`, which also means
`nubusStackDataUms.templateContext.initialPasswordAdministrator` no longer has
to be set.
*/ -}}
{{- if .Values.nubusCredentialsSecret.create -}}
{{- $nubusSecrets = append $nubusSecrets
  (dict "name" "nubus-credentials" "stringData" (dict
    "administrator_password" (tpl .Values.nubusStackDataUms.templateContext.initialPasswordAdministrator . | quote )
  ))
-}}
{{- end -}}

{{- $nubusSecrets = append $nubusSecrets
  (dict "name" "provisioning-udm-listener-ldap-tls" "stringData" (dict
    "ca.crt" ""
    "tls.key" ""
    "tls.crt" ""
  ))
-}}

{{- range $secret := $nubusSecrets }}
---
kind: "Secret"
apiVersion: "v1"
type: {{ .type | default "Opaque" | quote }}
metadata:
  name: {{ printf "%s-%s" $.Release.Name .name | quote }}
  namespace: {{ include "common.names.namespace" $ | quote }}
  labels:
    {{- include "common.labels.standard" $ | nindent 4 }}
    {{- if $.Values.additionalLabels }}
    {{- include "common.tplvalues.render" ( dict "value" $.Values.additionalLabels "context" $ ) | nindent 4 }}
    {{- end }}
  {{- if $.Values.additionalAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" $.Values.additionalAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
{{- if .data }}
data:
{{- range $k, $v := .data }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
{{- end }}
{{- if .stringData }}
stringData:
{{- range $k, $v := .stringData }}
  {{ $k }}: {{ $v }}
{{- end }}
{{- end }}
...
{{- end }}
